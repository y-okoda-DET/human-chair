<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人間椅子 試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&display=swap">
</head>
<body>

<canvas id="c"></canvas>
<canvas id="w" hidden></canvas>
<canvas id="seam" hidden></canvas>
<div id="wfade"></div>
<div id="stick" hidden><i></i></div>
<div id="place"><b></b><small>第三夜</small></div>
<div class="hud" id="sus"><i></i></div>
<span id="suslabel">気配</span>
<div id="lung"><i></i></div><span id="lunglabel">息</span>
<div class="hud" id="sub"></div>
<div id="bal"><i></i></div>
<div id="ctl">
  <button id="bl" aria-label="左に重心">◀<small>←</small></button>
  <button id="bb">息を殺す<small>押している間 / Space</small></button>
  <button id="br" aria-label="右に重心">▶<small>→</small></button>
</div>

<div class="ov" id="title">
  <div class="card">
    <span class="k">江戸川乱歩「人間椅子」より · 試作第一号</span>
    <h1>人間椅子</h1>
    <p>私は今、革張りの肘掛椅子の胴の中に、身を潜めております。<br>光は届きません。革一枚を隔てて伝わるのは、重みと、体温と、物音ばかり。</p>
    <p class="k">上の者が耳を澄ませたなら、息を殺すのです。<br>椅子が鳴いたなら、重心を戻すのです。<br>気配が満ちた時、すべてが終ります。</p>
    <button id="start">蓋を閉ざす</button>
    <button id="jump3" class="mock">第三夜から（試作用）</button>
    <button id="jumpL" class="mock">手紙を選ぶところから（試作用）</button>
    <span class="k">音が出ます。イヤホンをお薦めします。</span>
  </div>
</div>

<div class="ov" id="pick" hidden><div class="card"><span class="k">今宵の一節を、手紙に認める</span><div id="picks"></div></div></div>
<div id="paper" hidden><div id="paperin"></div></div>
<div class="ov" id="intro" hidden><p id="introp"></p><button id="skip">飛ばす</button></div>

<div class="ov" id="fin" hidden><div class="fincol"><span class="fk">江戸川乱歩「人間椅子」より</span><h1>人間椅子</h1></div><div class="finbtns"><button id="finx">Xで広める</button><button id="finbtn">手紙を読み返す</button></div></div>
<div class="ov" id="result" hidden>
  <div class="card">
    <span class="k" id="rk"></span>
    <h1 id="rh" style="font-size:clamp(28px,6vw,44px)"></h1>
    <img id="cardimg" alt="結果の画像">
    <div class="letter" id="letter"></div>
    <div class="share"><button id="save">画像を残す</button><button id="xshare">Xで広める</button><button id="copy">記録を写す</button><button id="retry" hidden>この夜から</button><button id="again">もう一度</button></div>
    <span id="toast"></span>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
